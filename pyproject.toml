[project]
name = "folio"
version = "1.0.1"
description = "A personal record keeper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
folio = "folio.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=1.0",
    "pytest-cov>=6.0",
    "pytest>=9.0.3",
    "ruff>=0.9",
]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "N"]

[tool.coverage.run]
source = ["folio"]
relative_files = true

