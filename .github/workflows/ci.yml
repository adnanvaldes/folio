name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run black --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/
      - run: uv run pytest
